name: Update PubMed papers

on:
  workflow_dispatch:
  schedule:
    # 日本時間の毎朝6時10分
    # GitHub ActionsのcronはUTCなので、前日の21時10分を指定
    - cron: "10 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NCBI_EMAIL: your-email@example.com
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and process PubMed papers
        run: python scripts/fetch_pubmed.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/papers.json docs/data/status.json

          if git diff --cached --quiet; then
            echo "更新はありません"
          else
            git commit -m "Update PubMed papers"
            git push
          fi
