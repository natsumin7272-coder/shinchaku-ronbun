<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新着論文</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">新着論文 🌸<small>PubMed research intelligence</small></div>
  <button id="reloadBtn" class="primary">再読み込み</button>
</header>

<main class="wrap">
  <section class="hero">
    <h1>新着論文まとめ</h1>
    <p>原文Abstract、日本語訳、簡易要約、方法・結果の詳細をまとめて確認できます。</p>
    <div id="notice" class="notice"></div>
    <div class="stats">
      <div class="stat"><b id="todayCount">0</b><small>本日の新着</small></div>
      <div class="stat"><b id="yesterdayCount">0</b><small>昨日</small></div>
      <div class="stat"><b id="unreadCount">0</b><small>未読</small></div>
      <div class="stat"><b id="favoriteCount">0</b><small>お気に入り</small></div>
    </div>
  </section>

  <section class="controls">
    <input id="searchInput" placeholder="タイトル・著者・Abstract・キーワードを検索">
    <select id="dateMode">
      <option value="all">すべての日付</option>
      <option value="today">今日</option>
      <option value="yesterday">昨日</option>
      <option value="7days">直近7日</option>
      <option value="exact">指定日</option>
    </select>
    <input id="exactDate" type="date">
    <select id="sortMode">
      <option value="new">新着順</option>
      <option value="score">関連度順</option>
    </select>
    <button id="selectVisibleBtn">表示中を選択</button>
    <button id="exportBtn" class="primary">CSV出力</button>
  </section>

  <div id="categories" class="chips"></div>
  <div class="countbar"><span id="paperCount">0件</span><span id="selectedCount">0件選択</span></div>
  <section id="cards" class="cards"></section>
</main>

<div id="modal" class="modal">
  <div class="modal-panel">
    <button id="closeModal" class="close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<button id="chatToggle" class="chat-toggle primary">日本語で質問</button>
<div id="chatPanel" class="chat-panel">
  <b>選択論文に質問</b>
  <div id="chatLog" class="chat-log">論文を選択してください。</div>
  <textarea id="chatQuestion" placeholder="方法は？主要結果は？対象数は？"></textarea>
  <button id="askBtn" class="primary">質問する</button>
</div>

<script src="app.js"></script>
</body>
</html>
